name: Deploy Flutter Web to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Preferred: commit the parser package into this repo as
      # ./bible_parser_flutter/ and it is used as-is. Otherwise it is checked out
      # from PARSER_REPO.
      - name: Checkout parser package
        if: ${{ hashFiles('bible_parser_flutter/pubspec.yaml') == '' }}
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.PARSER_REPO || 'PopGTN/bible_parser_flutter' }}
          token: ${{ secrets.PARSER_REPO_TOKEN || github.token }}
          path: bible_parser_flutter

      - name: Place parser beside the app
        run: mv bible_parser_flutter ../bible_parser_flutter

      # The app needs the extended parser (VerseSpan, Footnote, CrossReference,
      # DocumentBlock, TocLabel). Fail early with a clear message if the package
      # found is an older/upstream version without them.
      - name: Verify parser package has the models the app needs
        run: |
          missing=""
          for c in VerseSpan Footnote CrossReference DocumentBlock TocLabel; do
            grep -rqE "class $c\b|enum $c\b" ../bible_parser_flutter/lib || missing="$missing $c"
          done
          if [ -n "$missing" ]; then
            echo "::error::bible_parser_flutter is missing:$missing. The app was written against a newer local copy of the parser. Commit that copy into this repo as ./bible_parser_flutter/ (or point PARSER_REPO at the repo that has it)."
            exit 1
          fi

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        run: |
          git clone https://github.com/flutter/flutter.git --depth 1 -b 3.35.3 "$HOME/flutter"
          echo "$HOME/flutter/bin" >> "$GITHUB_PATH"

      - name: Flutter version
        run: flutter --version

      - name: Get dependencies
        working-directory: .
        run: flutter pub get

      - name: Build web
        working-directory: .
        run: flutter build web --release --base-href "/basic_bible/"

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

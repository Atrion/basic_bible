name: Deploy Flutter Web to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # pubspec.yaml expects the parser package at ../bible_parser_flutter.
      # Set repo variable PARSER_REPO ("owner/repo"); add secret
      # PARSER_REPO_TOKEN if that repo is private.
      - name: Checkout parser package
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.PARSER_REPO || 'PopGTN/bible_parser_flutter' }}
          token: ${{ secrets.PARSER_REPO_TOKEN || github.token }}
          path: bible_parser_flutter

      - name: Place parser beside the app
        run: mv bible_parser_flutter ../bible_parser_flutter

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        run: |
          git clone https://github.com/flutter/flutter.git --depth 1 -b stable "$HOME/flutter"
          echo "$HOME/flutter/bin" >> "$GITHUB_PATH"

      - name: Flutter version
        run: flutter --version

      - name: Get dependencies
        working-directory: .
        run: flutter pub get

      - name: Build web
        working-directory: .
        run: flutter build web --release --base-href "/basic_bible/"

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

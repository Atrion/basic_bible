# Added by From Gravel Hill Enterprises (https://fromgravelhill.ca/)
name: Build Android APK Release

# Runs automatically on every push to main, and can also be started by hand
# (Actions tab > "Build Android APK Release" > Run workflow).
# Each run publishes a GitHub Release with the next revision number:
# v0.01, v0.02, v0.03 ... (the number goes up by 0.01 every release).
# To jump to a full release (e.g. 1.00), run it manually with "version_override".
on:
  push:
    branches: [main]
    paths-ignore: # docs-only pushes don't need a new APK
      - '**.md'
      - 'docs/**'
      - '.vscode/**'
      - '.claude/**'
  workflow_dispatch:
    inputs:
      version_override:
        description: 'Optional full version to release instead of the next revision (e.g. 1.00)'
        required: false
        default: ''
      notes:
        description: 'Optional release notes'
        required: false
        default: ''

permissions:
  contents: write # create the release and upload the APK

concurrency:
  group: apk-release
  cancel-in-progress: false # never cancel a release mid-way (keeps numbering safe)

env:
  # The app depends on a sibling package (path: ../bible_parser_flutter) that is
  # not part of this repo. Set the repository variable PARSER_REPO
  # (Settings > Secrets and variables > Actions > Variables) to "owner/repo".
  PARSER_REPO: ${{ vars.PARSER_REPO || 'PopGTN/bible_parser_flutter' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout app
        uses: actions/checkout@v4

      # Preferred: commit the parser package into this repo as
      # ./bible_parser_flutter/ and it is used as-is. Otherwise it is checked out
      # from PARSER_REPO.
      - name: Checkout parser package
        if: ${{ hashFiles('bible_parser_flutter/pubspec.yaml') == '' }}
        uses: actions/checkout@v4
        with:
          repository: ${{ env.PARSER_REPO }}
          token: ${{ secrets.PARSER_REPO_TOKEN || github.token }}
          path: bible_parser_flutter

      - name: Place parser beside the app
        run: mv bible_parser_flutter ../bible_parser_flutter

      # The app needs the extended parser (VerseSpan, Footnote, CrossReference,
      # DocumentBlock, TocLabel). Fail early with a clear message if the package
      # found is an older/upstream version without them.
      - name: Verify parser package has the models the app needs
        run: |
          missing=""
          for c in VerseSpan Footnote CrossReference DocumentBlock TocLabel; do
            grep -rqE "class $c\b|enum $c\b" ../bible_parser_flutter/lib || missing="$missing $c"
          done
          if [ -n "$missing" ]; then
            echo "::error::bible_parser_flutter is missing:$missing. The app was written against a newer local copy of the parser. Commit that copy into this repo as ./bible_parser_flutter/ (or point PARSER_REPO at the repo that has it)."
            exit 1
          fi

      - name: Work out next version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          OVERRIDE: ${{ inputs.version_override }}
        run: |
          set -euo pipefail
          # Versions are tracked as integer hundredths: 0.01 -> 1, 0.10 -> 10, 1.00 -> 100.
          if [ -n "$OVERRIDE" ]; then
            if ! [[ "$OVERRIDE" =~ ^[0-9]+\.[0-9]{2}$ ]]; then
              echo "::error::version_override must look like 1.00 or 0.25 (two decimals)"; exit 1
            fi
            WHOLE="${OVERRIDE%%.*}"; FRAC="${OVERRIDE##*.}"
            N=$(( 10#$WHOLE * 100 + 10#$FRAC ))
          else
            LAST=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 1000 --json tagName \
              --jq '.[].tagName' | grep -E '^v[0-9]+\.[0-9]{2}$' | sed 's/^v//' \
              | awk -F. '{ printf "%d\n", $1*100 + $2 }' | sort -n | tail -1 || true)
            N=$(( ${LAST:-0} + 1 ))
          fi
          VERSION=$(printf '%d.%02d' $(( N / 100 )) $(( N % 100 )))
          if gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Release v$VERSION already exists"; exit 1
          fi
          echo "version=$VERSION"  >> "$GITHUB_OUTPUT"
          echo "build_number=$N"   >> "$GITHUB_OUTPUT"
          echo "Releasing v$VERSION (versionCode $N)"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          # Pinned to the version this app was built with (see .metadata).
          # Newer Flutter releases require a newer Gradle/AGP than the app's
          # android/ folder uses. Bump only after upgrading android/.
          flutter-version: '3.35.3'
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Get dependencies
        run: flutter pub get

      # Quality gate: if analysis finds errors or any test fails, the job stops
      # here and NO release is published (the version number is not used up).
      # Lints/warnings are reported in the log but do not block a release.
      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Install SQLite (used by the database tests)
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev

      - name: Run tests
        run: flutter test

      # Optional: provide these 4 secrets to sign with your own key so each
      # release can update the previous one on a phone:
      #   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD,
      #   ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
      - name: Configure release signing
        id: signing
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > android/release.jks
            {
              echo "storeFile=release.jks"
              echo "storePassword=$KEYSTORE_PASSWORD"
              echo "keyAlias=$KEY_ALIAS"
              echo "keyPassword=$KEY_PASSWORD"
            } > android/key.properties
            echo "signed=release key" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::No keystore secrets set - APK is debug-signed and cannot update a previously installed release signed on another build."
            echo "signed=debug key" >> "$GITHUB_OUTPUT"
          fi

      # Optional: add a GOOGLE_WEB_CLIENT_ID repository secret to enable Google
      # sign-in (notes sync/backup) in the built app. Without it the app still
      # works, but the Google sign-in option will not.
      - name: Build APK
        env:
          GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
        run: |
          DEFINES=()
          if [ -n "$GOOGLE_WEB_CLIENT_ID" ]; then
            DEFINES+=("--dart-define=GOOGLE_WEB_CLIENT_ID=$GOOGLE_WEB_CLIENT_ID")
          fi
          flutter build apk --release \
            --build-name="${{ steps.version.outputs.version }}" \
            --build-number="${{ steps.version.outputs.build_number }}" \
            "${DEFINES[@]}"

      - name: Name the APK
        run: |
          mkdir -p releases
          cp build/app/outputs/flutter-apk/app-release.apk \
             "releases/basic_bible-v${{ steps.version.outputs.version }}.apk"
          ls -lh releases

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          SIGNED: ${{ steps.signing.outputs.signed }}
          NOTES: ${{ inputs.notes || github.event.head_commit.message }}
        run: |
          set -euo pipefail
          {
            echo "Basic Bible App v$VERSION"
            echo
            [ -n "$NOTES" ] && { echo "$NOTES"; echo; }
            echo "Signed with: $SIGNED"
          } > release_notes.md
          gh release create "v$VERSION" "releases/basic_bible-v$VERSION.apk" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "v$VERSION" \
            --notes-file release_notes.md

      - name: Keep a copy as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: basic_bible-v${{ steps.version.outputs.version }}
          path: releases/*.apk
          if-no-files-found: error
